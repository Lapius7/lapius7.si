    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"lapius7.si","url":"https://lapius7.si/","inLanguage":"ja","publisher":{"@type":"Organization","name":"Lapius7","url":"https://lapius7.com/"}}
    </script>
    <script>
      // 初回描画前にテーマを決めて、白い画面の点滅を防ぐ
      (function () {
        try {
          var s = localStorage.getItem("l7.dark");
          var dark = s === null ? matchMedia("(prefers-color-scheme: dark)").matches : s === "1";
          if (dark) document.documentElement.classList.add("dark");
          var h = localStorage.getItem("l7.hue");
          if (h) document.documentElement.style.setProperty("--accent-h", h);
        } catch (e) {}
      })();
    </script>
